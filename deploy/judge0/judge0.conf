# ==========================================================================
# Judge0 configuration — shared by the control-plane and the worker MIG.
# Fill every <PLACEHOLDER> before deploying. Keep the AUTHN/AUTHZ tokens
# secret; the same file is baked into the worker image.
# ==========================================================================

# --- Redis (queue) --------------------------------------------------------
# On the CONTROL VM this is 127.0.0.1. On WORKER nodes set it to the control
# VM's INTERNAL IP (e.g. 10.128.0.5). Never expose Redis on a public IP.
REDIS_HOST=<CONTROL_VM_INTERNAL_IP>
REDIS_PORT=6379
REDIS_PASSWORD=<STRONG_REDIS_PASSWORD>

# --- Postgres (submissions store) ----------------------------------------
# Same rule as Redis: 127.0.0.1 on the control VM, internal IP on workers.
POSTGRES_HOST=<CONTROL_VM_INTERNAL_IP>
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=<STRONG_POSTGRES_PASSWORD>

# --- Auth: closes the open-port hole. The edge function must send
#     `X-Auth-Token: <AUTHN_TOKEN>`; admin routes need AUTHZ_TOKEN. ---------
AUTHN_TOKEN=<LONG_RANDOM_AUTHN_TOKEN>
AUTHZ_TOKEN=<LONG_RANDOM_AUTHZ_TOKEN>

# --- Execution limits (mirror concurrent-config.json) ---------------------
# Hard caps students cannot exceed. Defaults are applied per-submission by
# the edge function too, but these are the ceilings.
MAX_CPU_TIME_LIMIT=2
MAX_WALL_TIME_LIMIT=5
MAX_MEMORY_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_NETWORK=false

# --- Queue back-pressure: reject (429) instead of melting under a spike ---
# Sized for the deadline burst; workers drain it. Tune during load test.
MAX_QUEUE_SIZE=500

# --- Housekeeping ---------------------------------------------------------
# Auto-purge finished submissions so Postgres stays lean during the exam.
MAINTENANCE_MODE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ALLOW_ENABLE_NETWORK=false
